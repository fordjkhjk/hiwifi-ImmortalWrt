# AdGuard Home 烘焙配置（全新刷机 / 恢复出厂时由 AGH 读取）
#
# 在 DNS 链路里的角色：总管家 —— 广告过滤 + 缓存 + 把查询转给 mosdns。
#   dnsmasq:53 → AdGuard Home:5335 → mosdns:5353 → 国内外分流
#
# ★ 本文件的结构必须与 AGH「自己写出来的」配置完全同构 ★
#   AGH 只在「文件 schema_version 落后」时才做迁移改写；改写产物一旦有结构
#   瑕疵，AGH 就会在下次启动崩掉。9/18、9/24 两次事故都是这么来的。
#
#   本版对应 **AGH 0.107.78 / schema_version: 34**（ImmortalWrt openwrt-25.12）。
#   骨架来源：把 0.107.46 那份丢给 0.107.78 的 --check-config，由它自己迁移
#   （28→29→…→34）写出来的文件，再填回我们的取值。
#   ⚠ 实测旧文件（schema 28）在 0.107.78 上会连做 6 次迁移并改写文件 —— 这正是
#   9/18 事故的触发路径。所以必须预先升到 34，让 AGH 读到就认、不动它。
#
#   相比 0.107.46 那份（schema 28），0.107.78 的 schema：
#     多了 dns.cache_enabled / cache_optimistic_answer_ttl / cache_optimistic_max_age
#          filtering.safe_fs_patterns、http.doh.routes
#          querylog.ignored_enabled、statistics.ignored_enabled
#     少了 tls.allow_unencrypted_doh
#
# 验证方式（最强证据 —— 不是「我看着对」，而是 AGH 自己认不认）：
#   <AGH 0.107.78 本体> --check-config -c <本文件>
#   必须 exit=0，**且校验前后 md5 不变**（变了 = 触发了 schema 迁移 = 没改对）。
#   官方 Release 有 AdGuardHome_windows_amd64.zip / AdGuardHome_linux_mipsle_softfloat.tar.gz，
#   在 PC 上验即可（schema 只与版本有关、与架构无关）。
#
# 关键设计项（与商定一致）：
#   - 上游 DNS：只一行 127.0.0.1:5353（mosdns），不做并行多上游
#   - 请求方式：负载均衡（单上游时语义干净）
#   - 速度限制：0（不限，避免误伤浏览器并发查询）
#   - 禁用 IPv6 解析：开（家里无 IPv6）
#   - 缓存：1MB（原 4MB。上下有 dnsmasq 8000 条、mosdns 4096 条兜底）——2026-09-25 省内存项
#   - 乐观缓存：开
#   - querylog 6h（原 12h）/ statistics 24h —— 都往 tmpfs（内存盘）写，
#     AGH 轮转是「旧文件改名成 .1、不删除」⇒ 稳态占用 ≈ 2×interval
#   - 安全搜索：关（不强制）
#   - filters_update_interval 保持 24：flash 寿命按年计毫无压力（4.16MB/天），
#     延长只会让名单最多滞后一周，收益为零。
#   - users 留空 → 首次打开 http://<路由器IP>:3000 会进设置向导
#   - 广告过滤订阅不在此烘焙，首次进界面后自行添加（与旧库一致）

auth_attempts: 5
block_auth_min: 15
clients:
  persistent: []
  runtime_sources:
    arp: true
    dhcp: true
    hosts: true
    rdns: false
    whois: true
dhcp:
  dhcpv4:
    gateway_ip: ""
    icmp_timeout_msec: 1000
    lease_duration: 86400
    options: []
    range_end: ""
    range_start: ""
    subnet_mask: ""
  dhcpv6:
    lease_duration: 86400
    ra_allow_slaac: false
    ra_slaac_only: false
    range_start: ""
  enabled: false
  interface_name: ""
  local_domain_name: lan
dns:
  aaaa_disabled: true
  allowed_clients: []
  anonymize_client_ip: false
  bind_hosts:
    - 0.0.0.0
  blocked_hosts: []
  bogus_nxdomain: []
  bootstrap_dns: []
  bootstrap_prefer_ipv6: false
  cache_enabled: true
  cache_optimistic: true
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  # 1MB（原 4194304 = 4MB）。链路上下都有缓存兜底：
  #   dnsmasq 8000 条(上) / mosdns 4096 条(下)
  cache_size: 1048576
  cache_ttl_max: 0
  cache_ttl_min: 0
  disallowed_clients: []
  dns64_prefixes: []
  # 结构体（EDNSClientSubnet），写 bool 会被拒：
  #   cannot unmarshal !!bool into dnsforward.EDNSClientSubnet
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  enable_dnssec: false
  fallback_dns: []
  fastest_timeout: 1s
  handle_ddr: true
  hostsfile_enabled: true
  ipset: []
  ipset_file: ""
  local_ptr_upstreams: []
  max_goroutines: 300
  port: 5335
  private_networks: []
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  serve_http3: false
  serve_plain_dns: true
  trusted_proxies: []
  upstream_dns:
    - 127.0.0.1:5353
  upstream_dns_file: ""
  upstream_mode: load_balance
  upstream_timeout: 10s
  use_dns64: false
  use_http3_upstreams: false
  use_private_ptr_resolvers: false
filtering:
  blocked_response_ttl: 10
  # 结构体（BlockedServices，含 schedule 与 ids），写空序列会被拒：
  #   cannot unmarshal !!seq into filtering.BlockedServices
  # schedule 是本结构体的子键，不是 filtering 下的独立键。
  blocked_services:
    ids: []
    schedule:
      time_zone: UTC
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocking_mode: default
  cache_time: 30
  filtering_enabled: true
  filters_update_interval: 24
  parental_block_host: family-block.dns.adguard.com
  parental_cache_size: 1048576
  parental_enabled: false
  protection_disabled_until: null
  protection_enabled: true
  rewrites: []
  # AGH 自己写出来的是「当时 workdir 的绝对路径」。路由器上 workdir 是
  # /var/adguardhome（tmpfs），所以这里必须写路由器路径 ——
  # 千万别把 PC 上的 C:\Users\... 烘焙进固件。
  safe_fs_patterns:
    - /var/adguardhome/data/userfilters/*
  safe_search:
    bing: false
    duckduckgo: false
    enabled: false
    google: false
    pixabay: false
    yandex: false
    youtube: false
  safebrowsing_block_host: standard-block.dns.adguard.com
  safebrowsing_cache_size: 1048576
  safebrowsing_enabled: false
  safesearch_cache_size: 1048576
filters: []
http:
  address: 0.0.0.0:3000
  doh:
    insecure_enabled: false
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
  pprof:
    enabled: false
    port: 6060
  session_ttl: 720h
http_proxy: ""
language: ""
log:
  compress: false
  file: ""
  local_time: false
  max_age: 3
  max_backups: 0
  max_size: 100
  verbose: false
os:
  group: ""
  rlimit_nofile: 0
  user: ""
querylog:
  dir_path: ""
  enabled: true
  file_enabled: true
  ignored: []
  ignored_enabled: false
  # 6h（原 12h）。日志写 tmpfs，稳态占用 ≈ 2×interval ≈ 1.3MB
  interval: 6h
  size_memory: 1000
# 必须有，且须等于 AGH 本体的 schema 版本。缺了会触发迁移；值过旧同样触发。
# 9/18 事故的两个死因之一。必须是顶层键、后面不能再跟缩进子键
# （9/24 那次非法 YAML 就是把 ignored: [] 顶到了它下面）。
schema_version: 34
statistics:
  dir_path: ""
  enabled: true
  ignored: []
  ignored_enabled: false
  interval: 24h
theme: auto
tls:
  certificate_chain: ""
  certificate_path: ""
  dnscrypt_config_file: ""
  enabled: false
  force_https: false
  port_dns_over_quic: 853
  port_dns_over_tls: 853
  port_dnscrypt: 0
  port_https: 443
  private_key: ""
  private_key_path: ""
  server_name: ""
  strict_sni_check: false
user_rules: []
users: []
whitelist_filters: []
